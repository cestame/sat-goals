<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAT Tutoring · Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="login">
  <div class="login-card">
    <div class="brand" style="justify-content:center"><span class="brand-mark"><i></i></span><span>SAT Tutoring</span></div>
    <div class="card">
      <form class="card-b" id="form" novalidate>
        <div style="display:grid;gap:4px"><h1 style="font-size:22px">Log in</h1><p class="muted small">Type your first name and last initial, like “Amy W.”</p></div>
        <label class="field" for="name">Name<input type="text" id="name" autocomplete="name" autocapitalize="words" required></label>
        <label class="field" for="pw" id="pwWrap" hidden>Password<input type="password" id="pw" autocomplete="current-password"></label>
        <p class="err" id="err" role="alert"></p>
        <div id="newBox" class="callout" hidden>
          <p>We don't have that name yet. If you're a new student, start your profile.</p>
          <div class="row" style="margin-top:10px"><button type="button" class="btn primary sm" id="createBtn">I'm new, start my profile</button><button type="button" class="btn sm" id="retryBtn">Fix my name</button></div>
        </div>
        <button type="submit" class="btn primary" id="go" style="height:40px">Continue</button>
      </form>
    </div>
  </div>
</div>
<script src="/assets/common.js"></script>
<script>
(() => {
  const { $, api } = SAT;
  let needPw = false;
  $("#name").addEventListener("input", () => { if (needPw) { needPw = false; $("#pwWrap").hidden = true; $("#pw").value = ""; } $("#newBox").hidden = true; $("#go").hidden = false; $("#err").textContent = ""; });
  async function login(create) {
    const name = $("#name").value.trim(), err = $("#err"); err.textContent = "";
    if (!name) { err.textContent = "Type your name."; $("#name").focus(); return; }
    if (needPw && !$("#pw").value) { err.textContent = "Type your password."; $("#pw").focus(); return; }
    $("#go").disabled = true;
    try {
      const r = await api("/api/login", { body: { name, password: needPw ? $("#pw").value : undefined, create: !!create }, allow401: true });
      if (r.needPassword) { needPw = true; $("#pwWrap").hidden = false; $("#pw").focus(); return; }
      if (r.notFound) { $("#newBox").hidden = false; $("#go").hidden = true; return; }
      location.href = r.role === "tutor" ? "/tutor" : "/student";
    } catch (e) { err.textContent = e.message; if (needPw) $("#pw").select(); }
    finally { $("#go").disabled = false; }
  }
  $("#form").addEventListener("submit", (e) => { e.preventDefault(); login(false); });
  $("#createBtn").onclick = () => login(true);
  $("#retryBtn").onclick = () => { $("#newBox").hidden = true; $("#go").hidden = false; $("#name").select(); };
  api("/api/login", { allow401: true }).then((r) => { if (r.role === "tutor") location.href = "/tutor"; else if (r.role === "student") location.href = "/student"; }).catch(() => {});
  $("#name").focus();
})();
</script>
</body>
</html>
